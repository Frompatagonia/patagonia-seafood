<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Seguimiento satelital de buques pesqueros">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020b18"/>
      <stop offset=".55" stop-color="#062a49"/>
      <stop offset="1" stop-color="#0a5a74"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".72">
      <stop offset="0" stop-color="#24a3dd" stop-opacity=".38"/>
      <stop offset="1" stop-color="#24a3dd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#8fe2ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26855f"/>
      <stop offset="1" stop-color="#0d4738"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e6fa8"/>
      <stop offset="1" stop-color="#123a5c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <g fill="#bfefff" opacity=".55">
    <circle cx="90" cy="70" r="2"/><circle cx="150" cy="140" r="1.5"/><circle cx="210" cy="55" r="2.4"/>
    <circle cx="420" cy="90" r="1.7"/><circle cx="520" cy="40" r="2"/><circle cx="760" cy="100" r="1.6"/>
    <circle cx="860" cy="45" r="2.2"/><circle cx="1060" cy="70" r="1.8"/><circle cx="1130" cy="160" r="2"/>
    <circle cx="650" cy="180" r="1.4"/><circle cx="980" cy="210" r="1.6"/><circle cx="300" cy="190" r="1.4"/>
  </g>

  <path d="M300 250 C350 218 430 226 488 258 C532 284 552 332 536 380 C524 420 548 452 532 502 C516 552 486 594 452 612 C422 628 394 596 386 556 C378 516 350 496 340 456 C330 416 286 382 288 330 Z" fill="url(#land)" stroke="#6ff0c0" stroke-opacity=".35" stroke-width="2"/>
  <path d="M360 300 C390 312 420 350 418 395 C416 438 392 472 370 500" fill="none" stroke="#9affd8" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="5 8"/>
  <path d="M470 300 C500 330 508 372 496 410" fill="none" stroke="#9affd8" stroke-opacity=".16" stroke-width="1.5" stroke-dasharray="5 8"/>

  <g stroke="#7fe3ff" stroke-opacity=".38" stroke-width="2" fill="none">
    <path d="M250 250 L310 300"/><path d="M520 210 L480 290"/><path d="M920 260 L840 330"/>
    <path d="M1000 270 L880 400"/>
  </g>

  <!-- ocean route -->
  <path d="M430 610 C560 660 720 600 860 560 C930 540 980 530 1020 520" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="10 12" opacity=".85"/>
  <path d="M500 560 C640 610 790 560 930 500" fill="none" stroke="#5fd7ff" stroke-width="2" stroke-dasharray="4 10" opacity=".55"/>

  <!-- satellites -->
  <g>
    <g transform="translate(230 120) rotate(-8)">
      <rect x="-34" y="-18" width="68" height="36" rx="7" fill="#dbe9f5" stroke="#8fc6ea" stroke-width="2"/>
      <rect x="-96" y="-14" width="56" height="28" rx="3" fill="url(#panel)" stroke="#7fc4ee" stroke-width="2"/>
      <rect x="40" y="-14" width="56" height="28" rx="3" fill="url(#panel)" stroke="#7fc4ee" stroke-width="2"/>
      <path d="M-40 0H-96M40 0H96" stroke="#9dd8f5" stroke-width="2"/>
      <line x1="0" y1="18" x2="-6" y2="48" stroke="#9dd8f5" stroke-width="2"/>
      <path d="M-20 48h28" stroke="#9dd8f5" stroke-width="2"/>
      <circle cx="-6" cy="48" r="5" fill="#ffd166"/>
    </g>
    <g transform="translate(600 78) rotate(6)">
      <rect x="-30" y="-16" width="60" height="32" rx="6" fill="#dbe9f5" stroke="#8fc6ea" stroke-width="2"/>
      <rect x="-88" y="-13" width="52" height="26" rx="3" fill="url(#panel)" stroke="#7fc4ee" stroke-width="2"/>
      <rect x="36" y="-13" width="52" height="26" rx="3" fill="url(#panel)" stroke="#7fc4ee" stroke-width="2"/>
      <path d="M-36 0H-88M36 0H88" stroke="#9dd8f5" stroke-width="2"/>
      <line x1="0" y1="16" x2="-5" y2="42" stroke="#9dd8f5" stroke-width="2"/>
      <circle cx="-5" cy="42" r="5" fill="#ffd166"/>
    </g>
    <g transform="translate(980 150) rotate(-4)">
      <rect x="-32" y="-17" width="64" height="34" rx="7" fill="#dbe9f5" stroke="#8fc6ea" stroke-width="2"/>
      <rect x="-92" y="-14" width="54" height="28" rx="3" fill="url(#panel)" stroke="#7fc4ee" stroke-width="2"/>
      <rect x="38" y="-14" width="54" height="28" rx="3" fill="url(#panel)" stroke="#7fc4ee" stroke-width="2"/>
      <path d="M-38 0H-92M38 0H92" stroke="#9dd8f5" stroke-width="2"/>
      <line x1="0" y1="17" x2="6" y2="44" stroke="#9dd8f5" stroke-width="2"/>
      <circle cx="6" cy="44" r="5" fill="#ffd166"/>
    </g>
  </g>

  <!-- beams -->
  <g stroke="#5fd7ff" stroke-width="2" stroke-dasharray="7 9" opacity=".7">
    <path d="M245 172 L420 600"/>
    <path d="M610 130 L520 590"/>
    <path d="M975 205 L870 560"/>
  </g>

  <!-- ship -->
  <g transform="translate(380 590)">
    <path d="M-58 44 L58 44 L44 68 L-44 68 Z" fill="#e8f4ff" opacity=".92"/>
    <rect x="-36" y="26" width="72" height="18" rx="4" fill="#dbe9f5"/>
    <rect x="-22" y="10" width="44" height="18" rx="3" fill="#eef8ff"/>
    <rect x="-12" y="-4" width="24" height="14" rx="2" fill="#eef8ff"/>
    <line x1="0" y1="-4" x2="0" y2="-26" stroke="#eef8ff" stroke-width="2"/>
    <circle cx="0" cy="-28" r="3" fill="#ffd166"/>
    <path d="M-56 52h112" stroke="#ffd166" stroke-width="2" opacity=".7"/>
  </g>

  <!-- ground station -->
  <g transform="translate(1010 620)">
    <path d="M0 40 L-28 78 L28 78 Z" fill="#123a5c" stroke="#7fc4ee" stroke-width="2"/>
    <ellipse cx="0" cy="20" rx="34" ry="12" fill="#dbe9f5" stroke="#8fc6ea" stroke-width="2"/>
    <path d="M-20 20 L0 -18 L20 20" fill="none" stroke="#8fc6ea" stroke-width="3"/>
    <circle cx="0" cy="-18" r="6" fill="#ffd166"/>
    <path d="M-10 78 L0 40 L10 78" fill="none" stroke="#7fc4ee" stroke-width="2" opacity=".6"/>
  </g>

  <ellipse cx="600" cy="760" rx="500" ry="40" fill="#0a5a74" opacity=".25" filter="url(#soft)"/>
</svg>
